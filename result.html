<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Generated - SadTalker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --gradient-2: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
            --gradient-success: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-glow: 0 0 40px -10px var(--primary);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        /* Grid Pattern Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.8);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .logo i {
            font-size: 1.8rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* Success Card */
        .success-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.5), transparent);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--gradient-success);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem;
            color: white;
            animation: scaleIn 0.5s ease;
            box-shadow: 0 10px 30px -10px rgba(34, 197, 94, 0.5);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--gradient-success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .success-subtitle {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* Video Container */
        .video-container {
            background: var(--dark);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .video-container video {
            width: 100%;
            max-height: 500px;
            display: block;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .btn-success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-success:hover {
            background: rgba(34, 197, 94, 0.3);
            transform: translateY(-3px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .modal-body {
            padding: 24px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .history-name {
            color: var(--light);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-name i {
            color: var(--primary);
        }

        .history-actions {
            display: flex;
            gap: 10px;
        }

        .history-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .history-btn.view {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-light);
        }

        .history-btn.download {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .history-btn:hover {
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Processing State */
        .processing-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 24px;
            padding: 60px 40px;
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .processing-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }

        .processing-animation {
            width: 100px;
            height: 100px;
            position: relative;
            margin: 0 auto 30px;
        }

        .processing-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--primary);
            animation: spin 1.5s linear infinite;
        }

        .processing-ring:nth-child(2) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: var(--secondary);
            animation: spin 1s linear infinite reverse;
        }

        .processing-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--primary);
        }

        .processing-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .processing-subtitle {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .processing-progress {
            width: 250px;
            max-width: 80%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 0 auto 15px;
        }

        .processing-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gradient-1);
            border-radius: 4px;
            animation: processingProgress 20s ease-in-out forwards;
            transition: width 1s linear;
        }

        @keyframes processingProgress {
            0% { width: 0%; }
            10% { width: 20%; }
            30% { width: 45%; }
            50% { width: 65%; }
            70% { width: 80%; }
            90% { width: 92%; }
            100% { width: 95%; }
        }

        .processing-status {
            font-size: 0.9rem;
            color: var(--gray);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .success-card {
                padding: 30px 20px;
            }

            .success-title {
                font-size: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>

    <header class="header">
        <a href="/" class="logo">
            <i class="fas fa-robot"></i>
            <span>SadTalker</span>
        </a>
        <button class="nav-btn" onclick="openHistory()">
            <i class="fas fa-history"></i>
            History
        </button>
    </header>

    <div class="container">
        <!-- Processing State (shown while video is being generated) -->
        <div id="processingCard" class="processing-card">
            <div class="processing-animation">
                <div class="processing-ring"></div>
                <div class="processing-ring"></div>
                <div class="processing-icon">
                    <i class="fas fa-robot"></i>
                </div>
            </div>
            <h1 class="processing-title">Generating Your Video</h1>
            <p class="processing-subtitle">Our AI is working its magic. Please wait...</p>
            <div class="processing-progress">
                <div class="processing-progress-bar"></div>
            </div>
            <div class="processing-status">Processing image and audio...</div>
        </div>

        <!-- Success State (shown when video is ready) -->
        <div id="successCard" class="success-card hidden">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="success-title">Video Generated Successfully!</h1>
            <p class="success-subtitle">Your AI-powered talking head video is ready</p>

            <div class="video-container">
                <video id="resultVideo" controls autoplay loop>
                    <source src="/static/results/{{ video }}" type="video/mp4">
                    <source src="/static/results/{{ video }}" type="video/webm">
                    Your browser does not support video.
                </video>
            </div>

            <div class="action-buttons">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Create Another
                </a>
                <a href="/static/results/{{ video }}" download class="btn btn-success">
                    <i class="fas fa-download"></i>
                    Download Video
                </a>
                <button class="btn btn-secondary" onclick="openHistory()">
                    <i class="fas fa-history"></i>
                    View History
                </button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fas fa-history" style="color: var(--primary); margin-right: 10px;"></i>
                    Generation History
                </div>
                <button class="modal-close" onclick="closeHistory()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="historyList" class="history-list">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading history...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if video is ready
        const video = document.getElementById('resultVideo');
        const processingCard = document.getElementById('processingCard');
        const successCard = document.getElementById('successCard');
        const videoSrc = video.querySelector('source').src;
        
        // Status messages for processing state
        const statuses = [
            'Processing image and audio...',
            'Analyzing facial features...',
            'Generating facial animations...',
            'Synthesizing video frames...',
            'Applying enhancements...',
            'Finalizing your video...'
        ];
        
        let statusIndex = 0;
        const statusEl = document.querySelector('.processing-status');
        const progressBar = document.querySelector('.processing-progress-bar');
        
        // Use Server-Sent Events (SSE) for real-time progress
        const evtSource = new EventSource("/stream/{{ video }}");

        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Update Progress Bar
            if (data.progress >= 0) {
                // Handle transition from animation to real progress
                if (progressBar.style.animation !== 'none') {
                    const currentWidth = window.getComputedStyle(progressBar).width;
                    progressBar.style.animation = 'none';
                    progressBar.style.width = currentWidth;
                    // Force reflow to ensure transition starts from current width
                    void progressBar.offsetWidth;
                }
                progressBar.style.width = data.progress + '%';
            }

            // Update Status Text
            if (statusEl) {
                statusEl.textContent = data.message;
            }

            // Handle Completion
            if (data.progress >= 100) {
                evtSource.close();
                video.load(); // Reload video source
                setTimeout(() => {
                    processingCard.classList.add('hidden');
                    successCard.classList.remove('hidden');
                }, 500);
            }
            
            // Handle Error
            if (data.progress < 0) {
                evtSource.close();
                statusEl.textContent = data.message;
                statusEl.style.color = 'var(--error)';
            }
        };

        evtSource.onerror = function() {
            // If connection fails, we might want to close or retry
            // For now, we assume the server might just be restarting or busy
            console.log("SSE connection error");
        };
        
        // Also try to load the video directly
        video.addEventListener('canplay', function() {
            evtSource.close();
            processingCard.classList.add('hidden');
            successCard.classList.remove('hidden');
        });
        
        video.addEventListener('error', function() {
            // Keep showing processing state, will retry via polling
        });

        // History Modal
        function openHistory() {
            document.getElementById('historyModal').classList.add('active');
            fetchHistory();
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('active');
        }

        async function fetchHistory() {
            const list = document.getElementById('historyList');
            try {
                const res = await fetch('/history');
                const files = await res.json();
                
                if (files.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No generated videos yet</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = files.map(f => `
                    <div class="history-item">
                        <span class="history-name">
                            <i class="fas fa-video"></i>
                            ${f}
                        </span>
                        <div class="history-actions">
                            <a href="/result/${f}" class="history-btn view">
                                <i class="fas fa-eye"></i> View
                            </a>
                            <a href="/static/results/${f}" download class="history-btn download">
                                <i class="fas fa-download"></i> Download
                            </a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle" style="color: var(--error);"></i>
                        <p>Error loading history</p>
                    </div>
                `;
            }
        }

        // Close modal on outside click
        document.getElementById('historyModal').addEventListener('click', function(e) {
            if (e.target === this) closeHistory();
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeHistory();
        });
    </script>
</body>
</html>
